apiVersion: v1
kind: Namespace
metadata:
  labels:
    attach: "yes"
  name: medium
---
apiVersion: v1
kind: Service
metadata:
  name: preview-volatile-app
  namespace: medium
spec:
  ports:
    - port: 5000
      targetPort: app-port
  selector:
    app: volatile-app
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: volatile-app
  namespace: medium
spec:
  ports:
    - port: 5000
      targetPort: app-port
  selector:
    app: volatile-app
  type: ClusterIP
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: volatile-app-ro
  namespace: medium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volatile-app
  strategy:
    blueGreen:
      activeService: volatile-app
      autoPromotionEnabled: false
      previewService: preview-volatile-app
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app: volatile-app
    spec:
      containers:
        - env:
            - name: PORT
              value: "5000"
          image: chukmunnlee/volatile-app:1.0.0
          name: volatile-app
          ports:
            - containerPort: 5000
              name: app-port
              protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: active-volatile-app-httproute
  namespace: medium
spec:
  hostnames:
    - volatile-app.172.25.39.200.nip.io
  parentRefs:
    - name: default-gtw
      namespace: default
      port: 80
      sectionName: http
  rules:
    - backendRefs:
        - name: volatile-app
          port: 5000
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: preview-volatile-app-httproute
  namespace: medium
spec:
  hostnames:
    - preview.volatile-app.172.25.39.200.nip.io
  parentRefs:
    - name: default-gtw
      namespace: default
      port: 80
      sectionName: http
  rules:
    - backendRefs:
        - name: preview-volatile-app
          port: 5000
      matches:
        - path:
            type: PathPrefix
            value: /
